<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4E0">
<meta name="description" content="Merge ya Fool: a silly little merge puzzle game, coming soon.">
<title>Merge ya Fool</title>
<link rel="stylesheet" href="phone-tests/shared.css">
<style>
  body {
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  h1 { font-size: 34px; margin: 10px 0 4px; letter-spacing: .5px; }
  p { margin: 6px 0; line-height: 1.45; max-width: 340px; }
  #bobo { width: 150px; height: 150px; animation: bob 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes bob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-8px) scale(.97, 1.04); } }
  @media (prefers-reduced-motion: reduce) { #bobo { animation: none; } }
  .btn { margin-top: 18px; min-width: 220px; }
  small { color: var(--soft); margin-top: 18px; display: block; }
</style>
</head>
<body>
  <svg id="bobo" viewBox="0 0 120 120" role="img" aria-label="Bobo the jester, waving">
    <!-- jester hat: three floppy points with bells -->
    <path d="M30 50 Q22 18 6 22 Q24 30 34 44 Z" fill="#5CC9A7" stroke="#3B2440" stroke-width="4" stroke-linejoin="round"/>
    <path d="M90 50 Q98 18 114 22 Q96 30 86 44 Z" fill="#F38BB4" stroke="#3B2440" stroke-width="4" stroke-linejoin="round"/>
    <path d="M36 46 Q60 2 84 46 Z" fill="#FFC83D" stroke="#3B2440" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="6" cy="22" r="6" fill="#FFC83D" stroke="#3B2440" stroke-width="3"/>
    <circle cx="114" cy="22" r="6" fill="#FFC83D" stroke="#3B2440" stroke-width="3"/>
    <circle cx="60" cy="8" r="6" fill="#5CC9A7" stroke="#3B2440" stroke-width="3"/>
    <!-- face -->
    <circle cx="60" cy="72" r="32" fill="#FBD7B8" stroke="#3B2440" stroke-width="4"/>
    <circle cx="48" cy="68" r="4.5" fill="#3B2440"/><circle cx="72" cy="68" r="4.5" fill="#3B2440"/>
    <circle cx="40" cy="80" r="5" fill="#F38BB4" opacity=".6"/><circle cx="80" cy="80" r="5" fill="#F38BB4" opacity=".6"/>
    <path d="M47 82 Q60 96 73 82" fill="#fff" stroke="#3B2440" stroke-width="4" stroke-linejoin="round"/>
    <path d="M30 46 H90" stroke="#3B2440" stroke-width="5" stroke-linecap="round"/>
  </svg>
  <h1>Merge ya Fool</h1>
  <p>A silly little merge puzzle about Bobo, the clumsiest Royal Fool in Wobbledom.</p>
  <p><b>The game isn't here yet.</b> This page is for testing phones.</p>
  <a class="btn primary" href="phone-tests/">Open the phone tests</a>
  <small>Test build 0.0.2 · nothing leaves your phone</small>
</body>
</html>
